{% extends "base.html" %}
{% block content %}

<div class="vote-box mx-auto" style="max-width: 480px;">
    <h2 class="fw-bold text-center mb-2">Masuk SuaraKita</h2>

    <p class="text-muted text-center mb-4">
        Login sebagai user untuk voting, atau admin untuk mengelola sistem.
    </p>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input
                type="text"
                name="username"
                class="form-control"
                required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                required>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Login
        </button>

    </form>

    <p class="text-center mt-4 mb-0">
        Belum punya akun?
        <a href="/register">Daftar di sini</a>
    </p>
</div>

{% endblock %}
