{% extends "base.html" %}
{% block content %}

<div class="vote-box">
  <h2 class="fw-bold mb-2">Kelola Opsi Voting</h2>
  <p class="text-muted">{{ poll.question }}</p>

  <form method="POST" action="/admin/options/add/{{ poll.id }}" class="d-flex gap-2 mb-4">
    <input
      type="text"
      name="option_text"
      class="form-control"
      placeholder="Masukkan opsi baru"
      required>

    <button class="btn btn-primary">
      Tambah
    </button>
  </form>

  {% for option in options %}
  <div class="d-flex justify-content-between align-items-center border rounded-4 p-3 mb-2 bg-white">
    <strong>{{ option.option_text }}</strong>

    <a href="/admin/options/delete/{{ option.id }}" class="btn btn-danger btn-sm">
      Hapus
    </a>
  </div>
  {% else %}
  <p class="text-muted">Belum ada opsi untuk polling ini.</p>
  {% endfor %}

 <button
    onclick="history.back()"
    class="btn btn-outline-secondary mt-4 rounded-pill">

    <i class="bi bi-arrow-left"></i>
    Kembali

</button>
</div>

{% endblock %}
