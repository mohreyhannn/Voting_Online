{% extends "base.html" %}

{% block content %}
<div class="result-box">
    <h2 class="fw-bold">Hasil Voting</h2>
    <p class="text-muted mb-1">{{ poll.question }}</p>
    <p class="text-muted">Total suara masuk: <strong>{{ total_votes }}</strong></p>

    <div class="chart-box mt-4 mb-4">
        <canvas id="voteChart"></canvas>
    </div>

    {% for item in results %}
    <div class="result-item">
        <div class="d-flex justify-content-between">
            <strong>{{ item.option_text }}</strong>
            <span>{{ item.total_votes }} suara — {{ item.percentage }}%</span>
        </div>

        <div class="progress mt-2">
            <div class="progress-bar" data-percentage="{{ item.percentage }}"></div>
        </div>
    </div>
    {% endfor %}

    <a href="/polls" class="btn btn-outline-secondary rounded-pill px-4 mt-4">
        Kembali ke Polling
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    document.querySelectorAll('.progress-bar').forEach(function(bar) {
        let percentage = bar.dataset.percentage;
        bar.style.width = percentage + '%';
    });

    const voteLabels = JSON.parse(document.getElementById("chart-labels").textContent);
    const voteData = JSON.parse(document.getElementById("chart-data").textContent);

    const ctx = document.getElementById('voteChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: voteLabels,
            datasets: [{
                label: 'Jumlah Suara',
                data: voteData,
                borderWidth: 1,
                borderRadius: 12
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        precision: 0
                    }
                }
            }
        }
    });
</script>
{% endblock %}
